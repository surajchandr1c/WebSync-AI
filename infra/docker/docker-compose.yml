version: '3.8'

services:
  # PostgreSQL Persistence for Production / Cluster Setup
  postgres:
    image: postgres:16-alpine
    container_name: websync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-websync_ai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # WebSync AI Coordinator Service
  coordinator:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.coordinator
    container_name: websync-coordinator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - COORDINATOR_HOST=0.0.0.0
      - COORDINATOR_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/websync_ai
    depends_on:
      postgres:
        condition: service_healthy

  # WebSync AI Web Dashboard
  dashboard:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.dashboard
    container_name: websync-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      - coordinator

volumes:
  pgdata:
