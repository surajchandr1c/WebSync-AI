name: Cross-Platform Desktop & Worker Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-worker:
    name: Build Worker Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            binary_name: websync-worker.exe
            dist_path: worker/dist/websync-worker.exe
            artifact_name: websync-worker-windows-amd64.exe
          - os: ubuntu-22.04
            target: linux-amd64
            binary_name: websync-worker
            dist_path: worker/dist/websync-worker
            artifact_name: websync-worker-linux-amd64
          - os: macos-latest
            target: darwin-arm64
            binary_name: websync-worker
            dist_path: worker/dist/websync-worker
            artifact_name: websync-worker-darwin-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Worker Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil httpx websockets pydantic pydantic-settings

      - name: Package Standalone Worker Binary
        run: |
          pyinstaller worker/websync-worker.spec

      - name: Test Standalone Worker Binary Execution
        run: |
          ${{ matrix.dist_path }} --inspect

      - name: Upload Worker Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dist_path }}
          if-no-files-found: error

  build-desktop:
    name: Build Desktop Application (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Desktop Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Desktop Frontend
        run: pnpm --filter @websync/desktop build

      - name: Build Tauri Desktop Native Application
        run: pnpm --filter @websync/desktop tauri build

      - name: Upload Desktop Installer Artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: websync-desktop-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/websync-desktop.exe
          if-no-files-found: warn

      - name: Upload Desktop Installer Artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: websync-desktop-linux-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/websync-desktop
          if-no-files-found: warn

      - name: Upload Desktop Installer Artifacts (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: websync-desktop-macos-universal
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/websync-desktop
          if-no-files-found: warn
