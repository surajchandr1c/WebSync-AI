[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "websync-worker"
version = "0.3.0"
description = "WebSync AI Distributed Compute Node Worker Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
gpu = [
    "nvidia-ml-py>=12.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
websync-worker = "worker.agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
asyncio_mode = "auto"
